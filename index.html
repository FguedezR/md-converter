<!doctype html>
<html lang="en" data-accent="amber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07090d">
  <title>MD Converter · documents to Markdown in your browser</title>
  <meta name="description" content="Convert PDF, Word, PowerPoint, HTML and more to clean Markdown, and read .md files. Everything runs in your browser: nothing is uploaded.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="preload" href="fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/GeistPixel-Square.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="topbar">
        <p class="eyebrow">Runs in your browser · no uploads</p>
        <nav class="links" aria-label="Links">
          <a href="https://ferguedez.dev" target="_blank" rel="noopener">ferguedez.dev<span aria-hidden="true"> ↗</span></a>
          <a href="https://github.com/FguedezR/md-converter" target="_blank" rel="noopener">GitHub<span aria-hidden="true"> ↗</span></a>
        </nav>
      </div>
      <h1>MD<br>Converter</h1>
    </header>

    <div id="support" class="notice warn" role="alert" hidden></div>

    <label id="drop" class="drop" tabindex="0">
      <input id="file" type="file" multiple hidden>
      <svg id="iconDoc" class="drop-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M5.75 2.75h8.5l4 4v14.5H5.75z"/><path d="M14.25 2.75v4h4"/><path d="M8.75 11.25h6.5M8.75 14.25h6.5M8.75 17.25h4"/></svg>
      <span id="dropTitle" class="drop-title">Drop documents</span>
      <span id="dropHint" class="drop-hint">PDF · DOCX · PPTX · ODT · ODP · RTF · LaTeX · HTML · and more · several at once · .md opens in the reader</span>
    </label>
    <button class="link" type="button" data-open-md>Have a Markdown file? Open it in the reader →</button>

    <section class="controls first" aria-label="Options">
      <div class="field">
        <label for="sourceFormat">Source format</label>
        <select id="sourceFormat" class="wide">
          <option value="auto">Auto</option>
        </select>
      </div>
      <fieldset class="checks">
        <legend>Output</legend>
        <label class="check"><input id="frontMatter" type="checkbox"><span>Front matter</span></label>
        <label class="check"><input id="speakerNotes" type="checkbox"><span>Speaker notes</span></label>
        <label class="check"><input id="includeImages" type="checkbox"><span>Include images (ZIP)</span></label>
      </fieldset>
      <div class="actions">
        <button id="clear" type="button" disabled>Clear</button>
        <button id="convert" class="primary" type="button" disabled>Convert</button>
      </div>
    </section>

    <div id="consent" class="notice consent" role="alertdialog" aria-labelledby="consentText" hidden>
      <p id="consentText"></p>
      <div class="actions">
        <button id="consentNo" type="button">Skip</button>
        <button id="consentYes" class="primary" type="button">Download</button>
      </div>
    </div>

    <div id="progress" class="progress" hidden><span id="progressBar"></span></div>
    <p id="summary" class="status" role="status" aria-live="polite">Waiting for documents.</p>

    <div class="table-wrap">
      <table id="files" hidden>
        <thead><tr><th>File</th><th>Format</th><th class="num">Size</th><th>Result</th><th class="num"><span class="sr-only">Actions</span></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <section id="reader" class="reader" aria-label="Reader" data-view="preview" hidden>
      <div class="reader-bar">
        <div class="tabs" role="group" aria-label="View">
          <button type="button" data-reader-view="preview" aria-pressed="true">Preview</button>
          <button type="button" data-reader-view="source" aria-pressed="false">Source</button>
          <button type="button" data-reader-view="split" aria-pressed="false">Split</button>
        </div>
        <span id="readerName" class="reader-name"></span>
        <div class="reader-actions">
          <button id="copyMd" class="link" type="button">Copy</button>
          <button id="downloadMd" class="link" type="button">Download <span id="downloadExt">.md</span> <span aria-hidden="true">↓</span></button>
          <button class="link" type="button" data-open-md>Open .md…</button>
        </div>
      </div>
      <p id="readerStatus" class="reader-status" role="status" aria-live="polite"></p>
      <details id="toc" class="toc" hidden>
        <summary>Contents <span id="tocCount" class="toc-count"></span></summary>
        <ol id="tocList"></ol>
      </details>
      <div class="reader-body">
        <pre id="mdSource" class="md-source" tabindex="0" aria-label="Markdown source"></pre>
        <article id="mdPreview" class="md-preview" aria-label="Preview"></article>
      </div>
    </section>
    <input id="mdFile" type="file" accept=".md,.markdown,text/markdown" hidden>

    <footer class="foot">
      <p>Files never leave your device. Conversion happens locally with open-source libraries.</p>
    </footer>
  </main>
  <script src="vendor/marked-18.1.3.umd.js"></script>
  <script src="vendor/purify-3.4.17.min.js"></script>
  <script src="detect.js"></script>
  <script src="postprocess.js"></script>
  <script src="convert.js"></script>
  <script src="reader.js"></script>
  <script src="app.js"></script>
</body>
</html>
